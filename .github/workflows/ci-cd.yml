name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PRISM
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/ -q --cov=prism --cov-report=term-missing --cov-fail-under=60

      - name: Run PRISM self-tests
        run: python -m prism.cli test --quick

      - name: Verify CLI commands work
        run: |
          python -m prism.cli version
          python -m prism.cli agents
          python -m prism.cli help
          python -m prism.cli key status

      # `check` is the command developers actually run, and it is the one that
      # touches the filesystem, reads the ignore list and writes a report. The
      # smoke test above only proves the module imports, so a Windows-only
      # failure there would not be caught until someone ran it by hand. `lite`
      # keeps it deterministic (no API key needed) and the file is clean, so the
      # command is expected to exit 0.
      #
      # One python -c does the whole thing on purpose: `$RUNNER_TEMP` is a bash
      # variable but not a pwsh one, so a shell-level path silently became
      # "/prism_smoke.py" on windows-latest. Python resolves its own temp dir
      # and exits with the CLI's status, which is the same on every shell.
      - name: Verify check command works
        run: |
          python -c "import subprocess, sys, tempfile, os; p = os.path.join(tempfile.gettempdir(), 'prism_smoke.py'); open(p, 'w').write('def add(a, b):\n    return a + b\n'); r = subprocess.run([sys.executable, '-m', 'prism.cli', 'check', p, '--effort', 'lite', '--no-dashboard', '--json'], capture_output=True, text=True); sys.stdout.write(r.stdout); sys.stderr.write(r.stderr); sys.exit(r.returncode)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install pyflakes

      # pyflakes is the declared dev dependency, so CI checks the same thing a
      # developer gets locally. It reports undefined names, unused imports and
      # real syntax errors, and it is blocking: a lint failure means the package
      # does not import cleanly.
      - name: Lint (pyflakes)
        run: pyflakes prism/ tests/
