name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PRISM
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run PRISM self-tests
        run: python -m prism.cli test --quick

      - name: Verify CLI commands work
        run: |
          python -m prism.cli version
          python -m prism.cli agents
          python -m prism.cli help
          python -m prism.cli key status

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Check syntax (ruff)
        run: ruff check prism/ --select E9,F63,F7,F82 --statistics || true
        # F-rules catch undefined names, real syntax errors.
        # Style warnings are non-blocking for this project.