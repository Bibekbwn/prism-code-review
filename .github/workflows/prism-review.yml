name: PRISM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  prism-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PRISM
        run: |
          pip install -e .

      - name: Run PRISM review (lite - no API key needed)
        run: |
          python -m prism.cli check-staged --effort lite --json
        # Lite mode runs the deterministic regex agents only (no API key).
        # For full AI review, set GEMINI_API_KEY in repo secrets and
        # change --effort lite to --effort balanced above.
        continue-on-error: true