name: PRISM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  prism-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-diff can resolve the base ref.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PRISM
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Run PRISM review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BASE="${{ github.base_ref }}"
          if [ -z "$BASE" ]; then BASE=main; fi
          # AI agents when a key is configured, deterministic-only otherwise.
          # check-diff reviews the PR diff; check-staged would see an empty
          # index in a CI checkout and review nothing.
          if [ -n "$GEMINI_API_KEY" ]; then
            EFFORT=balanced
          else
            EFFORT=lite
          fi
          echo "PRISM effort: $EFFORT (base: origin/$BASE)"
          # No continue-on-error: blocking findings (severity >= block_on,
          # or an AI provider outage) fail this job.
          python -m prism.cli check-diff --base "origin/$BASE" --effort "$EFFORT" --json