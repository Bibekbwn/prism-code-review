[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-review"
version = "2.0.0"
description = "Local pre-commit multi-agent code review (regex + AI providers)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PRISM contributors" }]
keywords = ["code-review", "static-analysis", "pre-commit", "security", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8.0"]
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
dotenv = ["python-dotenv>=1.0.0"]
all = [
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyflakes>=3.0",
]

[project.scripts]
prism = "prism.cli:main"

[project.urls]
Homepage = "https://github.com/Bibekbwn/prism-code-review"
Issues = "https://github.com/Bibekbwn/prism-code-review/issues"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"